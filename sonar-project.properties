# ── SonarQube Cloud Project Identification ─────────────
sonar.projectKey=Bandayanon_SIA-flutter-app
sonar.organization=bandayanon
# ── Source Folders to Scan ─────────────────────────────
# lib/ = Flutter/Dart code
# app/ = PHP backend code (adjust to your folder name)
sonar.sources=lib
# ── Files/Folders to Exclude from Scanning ─────────────
sonar.exclusions=**/*.g.dart,**/vendor/**,**/node_modules/**,assets/riasec_db.sql,**/*.sql
sonar.secret.exclusions=assets/riasec_db.sql,**/*.sql

# ── Ignore Hardcoded Secrets & Build Metadata Issues ──
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11
sonar.issue.ignore.multicriteria.e1.ruleKey=secrets:S8215
sonar.issue.ignore.multicriteria.e1.resourceKey=assets/riasec_db.sql
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:S8215
sonar.issue.ignore.multicriteria.e2.resourceKey=backend/add_assessments.sql
sonar.issue.ignore.multicriteria.e3.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.sql
sonar.issue.ignore.multicriteria.e4.ruleKey=text:S8569
sonar.issue.ignore.multicriteria.e4.resourceKey=android/build.gradle.kts
sonar.issue.ignore.multicriteria.e5.ruleKey=plsql:LiteralsNonPrintableCharactersCheck
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.sql
sonar.issue.ignore.multicriteria.e6.ruleKey=php:S121
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.e7.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.e8.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e8.resourceKey=**/*.sql
sonar.issue.ignore.multicriteria.e9.ruleKey=cpp:S5028
sonar.issue.ignore.multicriteria.e9.resourceKey=windows/runner/resource.h
sonar.issue.ignore.multicriteria.e10.ruleKey=cpp:S3630
sonar.issue.ignore.multicriteria.e10.resourceKey=windows/runner/**/*.cpp
sonar.issue.ignore.multicriteria.e11.ruleKey=php:S1131
sonar.issue.ignore.multicriteria.e11.resourceKey=**/*.php
